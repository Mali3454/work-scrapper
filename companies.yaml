# skryptu na ich stronie kariery. Oferty zdalne, główna lokalizacja Wrocław;
# firma ma oferty otagowane Szczecinem na portalach.
- name: MasterBorn
  ats: lever
  slug: masterborn-2
  url: https://masterborn.com/career

# Shoper — strona kariery (kariera.shoper.pl, HTTP 200) wymienia Szczecin, więc
# obecność potwierdzona. Brak JAKIEGOKOLWIEK markera zewnętrznego ATS-u w HTML
# (sprawdzono: recruitee, traffit, lever, greenhouse, workable, smartrecruiters,
# eRecruiter, elevato, teamtailor, bamboohr) — własny system, parsera nie da się
# napisać. Jego 18 ofert (wszystkie remote, otagowane Krakowem) i tak wpada teraz
# do puli przez zapytanie ogólnopolskie na portalach.
- name: Shoper
  ats: custom
  url: https://kariera.shoper.pl/
  parser: skip

