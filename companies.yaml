# Firma ma oferty otagowane Szczecinem na portalach; wszystkie oferty na własnym
# boardzie są zdalne.
- name: Code & Pepper
  ats: recruitee
  slug: codepepper
  url: https://careers.codeandpepper.com/

# Zweryfikowano: GET https://api.lever.co/v0/postings/masterborn-2?mode=json →
