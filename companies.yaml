# Rejestr firm odpytywanych bezpośrednio (Task 14+).
#
# Każdy wpis zweryfikowany na żywo — metoda i wyniki opisane w
# .superpowers/sdd/2026-08-06-job-scraper/task-14-report.md.
#
# ats:
#   bamboohr, recruitee, greenhouse, lever, workable, smartrecruiters,
#   successfactors
#               — publiczne ATS-y obsługiwane przez parsery projektu.
#   sii, spyrosoft
#               — dedykowane integracje z firmowym API i paginacją.
#   html        — serwerowo renderowane listy; selektory są w tym pliku.
#   custom      — strona bez stabilnego parsera; `parser: skip` pomija wpis
#                 bez awarii całego przebiegu.

# Zweryfikowano bezpośrednio: GET https://espeo.recruitee.com/api/offers/
# → HTTP 200, realne oferty. Espeo Software ma siedzibę w Poznaniu (NIE w
# Szczecinie) — brak jakiejkolwiek szczecińskiej firmy IT z realnie
# działającym publicznym endpointem Recruitee wśród sprawdzonych kandydatów
# (patrz raport). Dołączona jako wymagane minimum zadania: firma z żywym
# API Recruitee, z której pobrano fixture i którą zweryfikowano na żywo.
- name: Espeo Software
  ats: recruitee
  slug: espeo
  url: https://espeo.eu/career/

# Szczecin, ul. Zbożowa 4. Zweryfikowano: strona kariery (welcome.home.pl/kariera)
# linkuje oferty do job-boards.eu.greenhouse.io/homepl/jobs/<id> — Greenhouse
# potwierdzony bezpośrednim requestem, i ponownie w Task 15 bezpośrednim
# GET https://boards-api.greenhouse.io/v1/boards/homepl/jobs -> HTTP 200,
# 4 oferty. `location.name` zwraca adres z niemieckim egzonimem "Stettin"
# zamiast "Szczecin" — normalizowane w parserze (patrz
# src/scrapper/sources/ats/greenhouse.py i docs/sources.md).
- name: home.pl
  ats: greenhouse
  slug: homepl
  url: https://welcome.home.pl/kariera

# TietoEVRY Poland (dawniej Tieto) — biuro w Szczecinie, aleja Piastów 30.
# Zweryfikowano: GET https://api.smartrecruiters.com/v1/companies/Tieto2/postings
# → HTTP 200, 372 oferty, z tego **14 w Szczecinie** (juniorzy C/C++, DevOps,
# testerzy, analitycy 4G/5G). Najlepsze źródło ofert IT ze Szczecina w całym
# rejestrze.
#
# UWAGA co do sluga: musi być dokładnie "Tieto2". Warianty "Tieto", "TietoEVRY"
# i "tietoevry" zwracają HTTP 200 z totalFound=0 — API NIE sygnalizuje złego
# sluga błędem, więc literówka cicho wyzeruje firmę.
- name: TietoEVRY
  ats: smartrecruiters
  slug: Tieto2
  url: https://careers.tieto.com/

# Spyrosoft Synergy — biuro w Szczecinie (wszczecinie.pl potwierdza otwarcie
# i rozwój lokalnego zespołu). Strona kariery (spyro-soft.com/career) to
# WordPress (widoczny marker `api.w.org` w HTML) z niestandardowym,
# renderowanym po stronie klienta listingiem ofert — brak śladu
# recruitee/traffit/lever/greenhouse/workable w HTML.
# Aktualizacja 2026-09-04: strona wystawia publiczny endpoint Teamtailor przez
# /wp-json/teamtailor/v1/get-jobs, wiec wpis nie jest juz pomijany.
- name: Spyrosoft
  ats: spyrosoft
  slug: spyrosoft
  url: https://spyro-soft.com/career

# Sii Polska — oddział Szczecin potwierdzony (sii.pl/en/branch/szczecin/,
